<!doctype html>
<!--
  PROTOTYPE, throwaway. The full SQLRunboard GUI from docs/spec.md "GUI", as one HTML file with a fake core.
  Open it in a browser. 1 real second = 10 run seconds. Nothing touches a disk or a server.
  Fake parts: logon (type "wrong" as the password to see a rejected password), scripts, file system, settings.json
  (localStorage stands in for it). nightly-maintenance fails its first logon with "no Kerberos ticket" on purpose.
-->
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>SQLRunboard GUI Prototype</title>
<style>
:root {
  --bg: #ffffff; --panel: #f6f8fa; --raise: #ffffff; --line: #d0d7de; --text: #1f2328; --muted: #59636e;
  --grey: #6E7781; --yellow: #9A6700; --green: #1A7F37; --red: #CF222E; --on: #ffffff; --sel: #0969da; --selbg: #ddf4ff; --warnbg: #fff8c5;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #202020; --panel: #2a2a2a; --raise: #303030; --line: #3d444d; --text: #e6edf3; --muted: #9198a1;
    --grey: #8B949E; --yellow: #D29922; --green: #3FB950; --red: #F85149; --on: #000000; --sel: #4493f8; --selbg: #1f3550; --warnbg: #3b2e00;
  }
}
:root[data-theme="dark"] {
  --bg: #202020; --panel: #2a2a2a; --raise: #303030; --line: #3d444d; --text: #e6edf3; --muted: #9198a1;
  --grey: #8B949E; --yellow: #D29922; --green: #3FB950; --red: #F85149; --on: #000000; --sel: #4493f8; --selbg: #1f3550; --warnbg: #3b2e00;
}
* { box-sizing: border-box; }
html, body { height: 100%; }
body { margin: 0; background: var(--bg); color: var(--text); font: 13px/1.4 system-ui, -apple-system, "Segoe UI", sans-serif; }
button, select, input { font: inherit; color: inherit; }
button { background: var(--panel); border: 1px solid var(--line); border-radius: 6px; padding: 3px 10px; cursor: pointer; white-space: nowrap; }
button:disabled { opacity: .45; cursor: default; }
button.primary { background: var(--sel); border-color: var(--sel); color: #fff; }
input[type=text], input[type=number], input[type=password], select { background: var(--bg); border: 1px solid var(--line); border-radius: 6px; padding: 4px 6px; }
:focus-visible { outline: 2px solid var(--sel); outline-offset: 1px; }
a { color: var(--sel); }
.tnum { font-variant-numeric: tabular-nums; }
.muted { color: var(--muted); }
.sr { position: absolute; width: 1px; height: 1px; overflow: hidden; clip: rect(0 0 0 0); }

.shell { display: flex; flex-direction: column; height: 100vh; }
.topbar { display: flex; flex-wrap: wrap; gap: 6px; align-items: center; padding: 6px 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
.topbar .app { font-weight: 700; margin-right: 8px; }
.topbar .sp { flex: 1; }
.topbar label { display: flex; align-items: center; gap: 6px; cursor: pointer; }
[role="switch"] { appearance: none; position: relative; width: 28px; height: 16px; margin: 0; border-radius: 8px; background: var(--line); cursor: pointer; }
[role="switch"]::before { content: ""; position: absolute; top: 2px; left: 2px; width: 12px; height: 12px; border-radius: 50%; background: var(--bg); transition: left .15s; }
[role="switch"]:checked { background: var(--sel); }
[role="switch"]:checked::before { left: 14px; }
[role="switch"]:focus-visible { outline: 2px solid var(--sel); outline-offset: 2px; }
.body { flex: 1; display: flex; min-height: 0; }

#side { width: 230px; flex: none; border-right: 1px solid var(--line); display: flex; flex-direction: column; overflow: auto; }
#side h2 { font-size: 11px; text-transform: uppercase; letter-spacing: .05em; color: var(--muted); margin: 10px 12px 4px; }
#side ul { list-style: none; margin: 0; padding: 0 6px; }
#side li { display: flex; gap: 8px; align-items: flex-start; padding: 6px; border-radius: 6px; cursor: pointer; }
#side li[aria-selected=true] { background: var(--selbg); }
#side li .n { font-weight: 600; }
#side li .p { font-size: 12px; color: var(--muted); overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
#side li > div { min-width: 0; }
#side > button { margin: 8px 12px; }

.main { flex: 1; min-width: 0; display: flex; flex-direction: column; }
#hdr { display: flex; flex-wrap: wrap; gap: 8px 12px; align-items: center; padding: 10px 16px 8px; }
#hdr h1 { font-size: 16px; margin: 0; }
.prog { flex-basis: 100%; height: 6px; background: var(--panel); border-radius: 3px; overflow: hidden; display: flex; }
.prog i { display: block; height: 100%; }
.banner { flex-basis: 100%; padding: 6px 10px; border-radius: 6px; background: var(--warnbg); border: 1px solid var(--line); }
.banner.err { border-color: var(--red); }
.tabs { display: flex; gap: 2px; padding: 0 16px; border-bottom: 1px solid var(--line); }
.tabs button { border: 0; border-bottom: 2px solid transparent; border-radius: 0; background: none; padding: 6px 12px; }
.tabs button[aria-selected=true] { border-bottom-color: var(--sel); font-weight: 600; }
#panel { flex: 1; min-height: 0; overflow: auto; padding: 10px 16px 16px; }
.toolbar { display: flex; flex-wrap: wrap; gap: 10px; align-items: center; margin-bottom: 10px; }
.seg { display: inline-flex; }
.seg button { border-radius: 0; margin-left: -1px; }
.seg button:first-child { border-radius: 6px 0 0 6px; } .seg button:last-child { border-radius: 0 6px 6px 0; }
.seg button[aria-pressed=true] { background: var(--selbg); border-color: var(--sel); }
.note { color: var(--muted); margin: 0 0 8px; }

.st { display: inline-flex; align-items: center; justify-content: center; width: 18px; height: 18px; border-radius: 50%; font-size: 11px; color: var(--on); flex: none; }
.s-NotRun, .s-Queued { background: var(--grey); } .s-Running { background: var(--yellow); } .s-Succeeded { background: var(--green); } .s-Failed, .s-Cancelled { background: var(--red); }
.hatch { background-image: repeating-linear-gradient(45deg, transparent 0 4px, rgba(127,127,127,.6) 4px 6px); }
.issel { background: var(--selbg) !important; outline: 2px solid var(--sel); outline-offset: -2px; }

.board { display: grid; grid-template-columns: repeat(4, minmax(160px, 1fr)); gap: 10px; align-items: start; }
.col { background: var(--panel); border-radius: 8px; padding: 8px; }
.col h3 { font-size: 12px; margin: 0 0 8px; text-transform: uppercase; letter-spacing: .04em; color: var(--muted); }
.card { background: var(--raise); border: 1px solid var(--line); border-radius: 6px; padding: 7px 9px; margin-bottom: 6px; cursor: pointer; }
.card .r1 { display: flex; gap: 6px; align-items: center; font-weight: 600; word-break: break-all; }
.card .r2 { display: flex; flex-wrap: wrap; gap: 4px 10px; color: var(--muted); font-size: 12px; margin-top: 3px; }

table { border-collapse: collapse; width: 100%; }
th, td { text-align: left; padding: 4px 8px; border-bottom: 1px solid var(--line); white-space: nowrap; }
th { color: var(--muted); font-weight: 600; }
th button { border: 0; background: none; padding: 0; font-weight: 600; color: var(--muted); }
tbody tr { cursor: pointer; }
td.num, th.num { text-align: right; }

.tlg { display: grid; align-items: center; min-width: 560px; }
.tlg > .c { padding: 0 6px; height: 26px; display: flex; align-items: center; gap: 6px; border-bottom: 1px dashed var(--line); white-space: nowrap; overflow: hidden; cursor: pointer; }
.tlg > .h { padding: 0 6px; color: var(--muted); font-weight: 600; font-size: 12px; align-self: end; }
.chart { position: relative; height: 26px; border-bottom: 1px dashed var(--line); cursor: pointer; }
.bar { position: absolute; top: 4px; height: 18px; min-width: 2px; border-radius: 3px; color: var(--on); font-size: 11px; line-height: 18px; padding: 0 3px; overflow: hidden; white-space: nowrap; text-align: right; container-type: inline-size; }
@container (max-width: 62px) { .bar .d { display: none; } }
@container (max-width: 12px) { .bar .i { display: none; } }
.brk { position: absolute; top: 0; bottom: 0; background: repeating-linear-gradient(90deg, var(--line) 0 2px, transparent 2px 5px); opacity: .7; }
.brkl { position: absolute; top: 0; font-size: 10px; color: var(--muted); white-space: nowrap; transform: translateX(-50%); background: var(--bg); padding: 0 2px; z-index: 1; }
.axis { position: relative; height: 18px; font-size: 11px; color: var(--muted); border-bottom: 1px solid var(--line); }
.axis span { position: absolute; transform: translateX(-50%); white-space: nowrap; }
.axis span:first-child { transform: none; } .axis span:last-child { transform: translateX(-100%); }
.striphead { position: relative; }
.strip { height: 44px; display: block; width: 100%; }

#drawer { width: 360px; flex: none; border-left: 1px solid var(--line); display: flex; flex-direction: column; min-height: 0; }
#drawer[hidden], #drawer-resize[hidden] { display: none; }
#drawer-resize { width: 6px; margin-right: -6px; flex: none; cursor: col-resize; position: relative; z-index: 2; touch-action: none; }
#drawer-resize:hover, #drawer-resize:focus-visible, #drawer-resize.drag { background: var(--sel); outline: none; }
.dh { padding: 10px 12px; border-bottom: 1px solid var(--line); display: flex; gap: 6px; flex-wrap: wrap; align-items: center; }
.dh .t { flex-basis: 100%; display: flex; gap: 6px; align-items: center; font-weight: 600; word-break: break-all; }
.msgs { flex: 1; overflow: auto; padding: 8px 12px; font-size: 12px; }
.msgs .sep { border-top: 1px solid var(--line); margin: 10px 0 4px; padding-top: 4px; color: var(--muted); font-weight: 600; }
.msgs .sep:first-child { margin-top: 0; }
.msgs .Error { color: var(--red); }
.msgs .RowCount { color: var(--muted); }

.src { margin: 0; font: 12px/1.5 ui-monospace, Menlo, Consolas, monospace; white-space: pre; overflow: auto; tab-size: 4; }
.src div { padding-right: 12px; }
.src .ln { display: inline-block; width: 4ch; margin-right: 12px; text-align: right; color: var(--muted); user-select: none; }
.src .go { color: var(--sel); font-weight: 600; }
.src .cm { color: var(--muted); }
.src .hl { background: color-mix(in srgb, var(--red) 18%, transparent); }
.files { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 16px; align-items: start; }
.preview { border: 1px solid var(--line); border-radius: 8px; overflow: hidden; }
.preview h3 { margin: 0; padding: 6px 10px; font-size: 12px; border-bottom: 1px solid var(--line); background: var(--panel); }
.preview .src { max-height: 60vh; padding: 6px 0; }
#drawer .src { flex: 1; padding: 8px 0; }
a[data-line] { color: inherit; text-decoration: underline; }
.form { display: grid; grid-template-columns: 190px minmax(0, 360px); gap: 8px 12px; align-items: center; }
.form h3 { grid-column: 1 / -1; margin: 12px 0 0; font-size: 13px; }
.form .hint { grid-column: 2; font-size: 12px; color: var(--muted); margin-top: -4px; }
.badge { font-size: 11px; padding: 0 6px; border-radius: 10px; border: 1px solid var(--line); }
.badge.new { border-color: var(--green); color: var(--green); }
.badge.miss { border-color: var(--red); color: var(--red); }

#dialog .ov { position: fixed; inset: 0; background: rgba(0,0,0,.45); display: flex; align-items: center; justify-content: center; z-index: 20; padding: 16px; }
#dialog .dlg { background: var(--raise); border: 1px solid var(--line); border-radius: 10px; padding: 16px 18px; width: 420px; max-width: 100%; box-shadow: 0 10px 40px rgba(0,0,0,.35); }
#dialog h2 { margin: 0 0 10px; font-size: 15px; }
#dialog dl { display: grid; grid-template-columns: auto 1fr; gap: 4px 12px; margin: 0 0 12px; }
#dialog dt { color: var(--muted); }
#dialog dd { margin: 0; }
#dialog .btns { display: flex; justify-content: flex-end; gap: 8px; margin-top: 14px; }
#dialog input { width: 100%; }
#menu .m { position: fixed; z-index: 30; background: var(--raise); border: 1px solid var(--line); border-radius: 8px; box-shadow: 0 6px 24px rgba(0,0,0,.3); padding: 4px; min-width: 210px; }
#menu button { display: flex; justify-content: space-between; gap: 16px; width: 100%; border: 0; background: none; text-align: left; padding: 5px 10px; border-radius: 5px; }
#menu button:not(:disabled):hover, #menu button:focus { background: var(--selbg); }
#menu hr { border: 0; border-top: 1px solid var(--line); margin: 4px 0; }
#toast { position: fixed; bottom: 16px; right: 16px; z-index: 40; background: #111; color: #fff; padding: 8px 14px; border-radius: 8px; max-width: calc(100% - 32px); }
#toast:empty { display: none; }

@media (max-width: 900px) {
  .body { flex-direction: column; overflow: auto; }
  #side { width: auto; border-right: 0; border-bottom: 1px solid var(--line); max-height: 30vh; }
  #drawer-resize { display: none; }
  #drawer { width: auto !important; border-left: 0; border-top: 1px solid var(--line); max-height: 45vh; }
  .board { grid-template-columns: repeat(2, minmax(0, 1fr)); }
  .form, .files { grid-template-columns: 1fr; } .form .hint { grid-column: 1; }
  #panel { overflow-x: auto; }
}
</style>
</head>
<body>
<div class="shell">
  <div class="topbar" role="toolbar" aria-label="App">
    <span class="app">SQLRunboard</span>
    <button data-cmd="new" title="Ctrl+N">New batch</button>
    <button data-cmd="open" title="Ctrl+O">Open…</button>
    <button data-cmd="save" title="Ctrl+S">Save</button>
    <button data-cmd="saveAs" title="Ctrl+Shift+S">Save as…</button>
    <button data-cmd="remove">Remove from list</button>
    <button data-cmd="appData">Open app data folder</button>
    <span class="sp"></span>
    <label><input type="checkbox" role="switch" id="theme"> Dark</label>
  </div>
  <div class="body">
    <nav id="side" aria-label="Batches"></nav>
    <div class="main">
      <header id="hdr"></header>
      <div class="tabs" role="tablist" id="tabs"></div>
      <div id="panel" role="tabpanel" data-scroll="panel"></div>
    </div>
    <div id="drawer-resize" role="separator" aria-orientation="vertical" aria-label="Drawer width" aria-controls="drawer" tabindex="0" hidden title="Drag to resize. Double-click to reset."></div>
    <aside id="drawer" aria-label="Messages" hidden></aside>
  </div>
</div>
<div id="dialog"></div>
<div id="menu"></div>
<div id="toast" role="status"></div>
<div id="live" class="sr" aria-live="polite"></div>
<script>
'use strict';
const SPEED = 10, TICK = 250; // run seconds per real second; the GUI tick from the spec
const isMac = /Mac|iPhone|iPad/.test(navigator.platform);
const MOD = isMac ? '⌘' : 'Ctrl+';

// ---------- settings.json stand-in ----------
const store = {
  get(k, d) { try { const v = localStorage.getItem('sqlrunboard-proto:' + k); return v == null ? d : JSON.parse(v); } catch { return d; } },
  set(k, v) { try { localStorage.setItem('sqlrunboard-proto:' + k, JSON.stringify(v)); } catch {} },
};
const app = { theme: store.get('theme', 'System'), view: store.get('view', 'board'), tlColumns: store.get('tlColumns', false), tlCollapse: store.get('tlCollapse', false), drawerWidth: store.get('drawerWidth', 360), batches: [], cur: null, untitled: 0, dialog: null, menu: null };

// ---------- fake batches ----------
let uid = 0;
const DEF = { folder: '.', filters: '*.sql', recurse: false, parallelLimit: 4, stopOnFirstFailure: false, confirmBeforeRun: false, timeoutSeconds: '', server: '', database: '', auth: 'Integrated', user: '', encrypt: 'Mandatory', trustServerCertificate: false, extra: '' };
function mkBatch(name, file, settings, scripts, extra = {}) {
  return Object.assign({
    id: ++uid, name, file, missing: false, dirty: false, tab: null, sel: null, drawer: false, password: null, signing: null,
    logonMsg: null, testMsg: null, run: null, sort: null, fileSel: null, kerberosFails: 0, scrollAttempt: null,
    settings: { ...DEF, ...settings },
    scripts: scripts.map(([path, dur, out, rows, x = {}]) => ({ path, include: x.include ?? true, state: x.state ?? 'Listed', plan: { dur, out, rows, err: x.err, dur2: x.dur2 } })),
  }, extra);
}
const deploy = mkBatch('deploy', '~/repos/sales-db/deploy.sqlrunboard.json',
  { folder: 'scripts', server: 'sql01.example.local', database: 'Sales', auth: 'SqlServer', user: 'deploy', stopOnFirstFailure: true, confirmBeforeRun: true }, [
  ['001_create_tables.sql', 20, 'ok', null], ['002_add_columns.sql', 15, 'ok', null], ['003_backfill_orders.sql', 180, 'ok', 1204331],
  ['004_backfill_customers.sql', 110, 'ok', 88412],
  ['005_fk_orders.sql', 30, 'fail', null, { err: 'line 214 (part 3): The ALTER TABLE statement conflicted with the FOREIGN KEY constraint "FK_orders_customers".' }],
  ['000_old_seed.sql', 5, 'ok', null, { state: 'Missing' }],
  ['006_index_orders.sql', 130, 'ok', null], ['007_views.sql', 12, 'ok', null], ['008_procs.sql', 18, 'opentran', null],
  ['009_grants.sql', 6, 'ok', null], ['010_verify_counts.sql', 40, 'ok', 14], ['legacy_cleanup.sql', 50, 'ok', 3001, { include: false }],
  ['011_hotfix_prices.sql', 25, 'ok', 42, { state: 'New' }],
]);
const nightly = mkBatch('nightly-maintenance', '~/ops/nightly-maintenance.sqlrunboard.json',
  { server: 'sql02.example.local', database: 'Warehouse', auth: 'Integrated', parallelLimit: 3, timeoutSeconds: '240' }, [
  ['01_rebuild_orders_ix.sql', 200, 'ok', null], ['02_rebuild_customers_ix.sql', 150, 'ok', null], ['03_update_stats.sql', 90, 'ok', null],
  ['04_purge_audit.sql', 400, 'ok', 52000, { dur2: 70 }], ['05_shrink_log.sql', 20, 'ok', null], ['06_check_db.sql', 180, 'ok', null],
], { kerberosFails: 1 });
const perf = mkBatch('perf-tests', '~/bench/perf-tests.sqlrunboard.json',
  { server: 'perf-sql.example.local', database: 'SalesCopy', auth: 'EntraInteractive', user: 'dba@example.com', parallelLimit: 8 },
  Array.from({ length: 16 }, (_, i) => [`q${String(i + 1).padStart(2, '0')}_${['top_customers', 'monthly_sales', 'open_orders', 'stock_levels'][i % 4]}.sql`, 20 + (i * 37) % 100, 'ok', i % 3 ? (i * 7919) % 50000 : null]));
const reporting = mkBatch('reporting', '~/repos/reporting/reporting.sqlrunboard.json', { server: 'sql03.example.local', database: 'Reports' }, [], { missing: true });
app.batches = [deploy, nightly, perf, reporting];

// ---------- fake core: run, attempts, events applied directly ----------
const DONE = ['Succeeded', 'Failed', 'Cancelled'];
const lastA = r => r.attempts[r.attempts.length - 1];
const firstStart = r => Math.min(...r.attempts.filter(a => a.start != null).map(a => a.start));
const planOf = (b, path) => b.scripts.find(s => s.path === path)?.plan ?? { dur: 30, out: 'ok', rows: null };
function newRun(b, wall) { return { t: 0, wall, live: true, ended: false, restored: false, endAt: null, newest: 0, queue: [], rs: {} }; }
function rsOf(run, path) { return run.rs[path] ??= { status: 'Queued', attempts: [], msgs: [] }; }
function msg(b, path, kind, text) { const r = b.run.rs[path]; r.msgs.push({ a: r.attempts.length, kind, text, t: b.run.t }); }
function queueAttempt(b, path) {
  const r = rsOf(b.run, path);
  r.attempts.push({ n: r.attempts.length + 1, status: 'Queued', start: null, end: null, rows: null, error: null });
  r.status = 'Queued'; b.run.queue.push(path); b.run.ended = false;
}
function finish(b, path, status, err) {
  const run = b.run, r = run.rs[path], a = lastA(r);
  a.end = run.t; a.status = r.status = status; a.error = err ?? null;
  if (err) msg(b, path, 'Error', err);
  msg(b, path, 'Info', `Attempt ${a.n} ${status} after ${dur(a.end - a.start)}`);
  if (status === 'Failed' && b.settings.stopOnFirstFailure) stopQueue(b);
}
function stopQueue(b) {
  const run = b.run;
  for (const path of run.queue) {
    const r = run.rs[path], a = lastA(r);
    a.status = r.status = 'Cancelled'; a.cancelAt = run.t; a.error = 'Not started: the queue stopped';
    msg(b, path, 'Info', a.error);
  }
  run.queue = [];
}
function step(b, dt) {
  const run = b.run, s = b.settings;
  if (!run?.live) return;
  run.t += dt;
  if (run.ended) return;
  const timeout = +s.timeoutSeconds || 0;
  for (const [path, r] of Object.entries(run.rs)) {
    if (r.status !== 'Running') continue;
    const a = lastA(r), p = planOf(b, path), el = run.t - a.start, d = a.n > 1 && p.dur2 ? p.dur2 : p.dur;
    if (a.rollback != null) { // open transaction check: the attempt keeps its slot until the rollback ends
      if (run.t - a.rollback >= 5) { msg(b, path, 'Error', 'The app rolled back an open transaction (@@TRANCOUNT was 1)'); finish(b, path, 'Failed', 'Open transaction at the end of the script: rolled back. Add COMMIT and rerun.'); }
      continue;
    }
    if (timeout && el >= timeout) { finish(b, path, 'Failed', `Timeout after ${timeout} s`); continue; }
    if (!a.m1 && el >= d / 3) { a.m1 = 1; msg(b, path, 'Info', 'Step 1 of 3 done'); }
    if (p.rows != null && !a.half && el >= d / 2) { a.half = 1; a.rows = Math.floor(p.rows / 2); msg(b, path, 'RowCount', `(${a.rows.toLocaleString()} rows affected)`); }
    if (el >= d) {
      if (p.out === 'fail' && a.n === 1) finish(b, path, 'Failed', p.err);
      else if (p.out === 'opentran' && a.n === 1) { a.rollback = run.t; msg(b, path, 'Info', 'Rolling back an open transaction'); }
      else { if (p.rows != null) { a.rows = p.rows; msg(b, path, 'RowCount', `(${(p.rows - Math.floor(p.rows / 2)).toLocaleString()} rows affected)`); } finish(b, path, 'Succeeded'); }
    }
  }
  const limit = +s.parallelLimit || 1;
  while (Object.values(run.rs).filter(r => r.status === 'Running').length < limit && run.queue.length) {
    const path = run.queue.shift(), r = run.rs[path], a = lastA(r);
    a.status = r.status = 'Running'; a.start = run.t; msg(b, path, 'Info', `Attempt ${a.n} started`);
  }
  if (!run.queue.length && !Object.values(run.rs).some(r => r.status === 'Running')) {
    run.ended = true; run.endAt = run.t;
    const c = counts(b);
    if (b.live !== false) announce(`${b.name}: Run ended: ${c.Succeeded} succeeded, ${c.Failed + c.Cancelled} failed`);
  }
}
function startRun(b) {
  b.run = newRun(b, new Date());
  for (const s of b.scripts) if (s.include && s.state !== 'Missing') queueAttempt(b, s.path);
  b.tab = 'run'; step(b, 0);

{
